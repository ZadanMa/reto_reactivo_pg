# src/main/resources/application.yml
spring:
  r2dbc:
    url: r2dbc:mysql://localhost:3306/tecnologia_db?sslMode=DISABLED
    username: root
    password: admin
  # Si utilizas Flyway u otra herramienta de migración, puedes configurarlo aquí
  flyway:
    enabled: false


  application:
    name: tecnologia
server:
  port: 8080



logging:
  level:
    root: INFO
eureka:
  client:
    serviceUrl:
      defaultZone: http://admin:eureka-secret@localhost:8761/eureka/
    fetch-registry: true
    register-with-eureka: true