spring:
  r2dbc:
    url: r2dbc:mysql://localhost:3306/bootcamps_db?sslMode=DISABLED&serverZoneId=UTC
    username: root
    password: admin
  flyway:
    enabled: false
  application:
    name: bootcamps

server:
  port: 8082  # Puedes asignar el puerto deseado para el microservicio

logging:
  level:
    root: INFO
eureka:
  client:
    serviceUrl:
      defaultZone: http://admin:eureka-secret@localhost:8761/eureka/
    fetch-registry: true
    register-with-eureka: true