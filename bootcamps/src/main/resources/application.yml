spring:
  r2dbc:
    url: r2dbc:mysql://localhost:3306/bootcamps_db?sslMode=DISABLED&serverZoneId=UTC
    username: root
    password: admin
  flyway:
    enabled: false
  application:
    name: bootcamp

server:
  port: 8084  # Puedes asignar el puerto deseado para el microservicio



eureka:
  client:
    serviceUrl:
      defaultZone: http://admin:eureka-secret@localhost:8761/eureka/
    fetch-registry: true
    register-with-eureka: true

logging:
  level:
    reactor:
      netty:
        http: DEBUG # O TRACE para más detalles
